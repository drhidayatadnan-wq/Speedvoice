<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NightPDF</title><style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#eee;font:15px system-ui;height:100dvh;display:flex;flex-direction:column}header,footer{background:#191b20;padding:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}strong{font-size:20px;margin-right:auto}button,input{font:inherit;color:#eee;background:#262932;border:1px solid #444955;border-radius:9px;padding:8px;min-height:40px}button:disabled{opacity:.4}#name,#status{font-size:12px;color:#b8bfcc;overflow-wrap:anywhere}#name{width:100%}#status{padding:5px 10px}main{flex:1;overflow:auto;text-align:center;padding:8px 0;touch-action:pan-x pan-y}canvas{display:block;margin:auto}#empty{margin:12vh 20px;color:#ccc}#empty h1{color:#fff}footer{justify-content:center}#pageNo{width:65px}#file{display:none}.hidden{display:none!important}
</style></head><body><header><strong>NightPDF</strong><button id="open">Open PDF</button><button id="mode">☾ Night</button><input id="file" type="file" accept="application/pdf,.pdf"><div id="name">No document open</div></header><main id="viewer"><div id="empty"><h1>Read without the glare.</h1><p>Black pages, white text and original image colours.</p><button id="open2">Choose PDF</button></div><canvas id="page" class="hidden"></canvas></main><div id="status">Select a PDF to begin.</div><footer><button id="prev">‹</button><input id="pageNo" type="number" min="1" value="1"><span id="count">/ —</span><button id="next">›</button><button id="out">−</button><span id="zoom">100%</span><button id="in">+</button><button id="fit">Fit</button></footer>
<script type="module">
const $=id=>document.getElementById(id), viewer=$('viewer'), canvas=$('page');
const base=new URL('./pdfjs/',location.href).href;
let pdfjs,doc=null,pageNo=1,zoom=1,night=localStorage.getItem('mode')!=='day',serial=0,loadSerial=0,task=null;
function status(s){$('status').textContent=s}
function controls(){for(const id of ['prev','next','pageNo','out','in','fit'])$(id).disabled=!doc;$('prev').disabled=!doc||pageNo<=1;$('next').disabled=!doc||pageNo>=doc.numPages;$('pageNo').value=pageNo;$('count').textContent=doc?'/ '+doc.numPages:'/ —';$('zoom').textContent=Math.round(zoom*100)+'%';$('mode').textContent=night?'☾ Night':'☀ Day'}
controls();
const engine=import(base+'legacy/build/pdf.mjs').then(m=>{pdfjs=m;m.GlobalWorkerOptions.workerSrc=base+'legacy/build/pdf.worker.mjs';return m});engine.catch(e=>status('PDF engine failed: '+e.message));
function neutralInverse(value){if(typeof value!=='string')return value;let m=/^#([0-9a-f]{6})$/i.exec(value),r,g,b,a=1;if(m){r=parseInt(m[1].slice(0,2),16);g=parseInt(m[1].slice(2,4),16);b=parseInt(m[1].slice(4,6),16)}else{m=/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)(?:\s*,\s*([\d.]+))?\s*\)$/i.exec(value);if(!m)return value;r=+m[1];g=+m[2];b=+m[3];a=m[4]??1}if(Math.max(r,g,b)-Math.min(r,g,b)>12)return value;const v=255-Math.round((r+g+b)/3);return 'rgba('+v+','+v+','+v+','+a+')'}
function selectiveNight(ctx){const undo=[];for(const [method,style,isText] of [['fill','fillStyle',false],['stroke','strokeStyle',false],['fillRect','fillStyle',false],['strokeRect','strokeStyle',false],['fillText','fillStyle',true],['strokeText','strokeStyle',true]]){const original=ctx[method],own=Object.getOwnPropertyDescriptor(ctx,method);Object.defineProperty(ctx,method,{configurable:true,writable:true,value:function(...args){const previous=this[style];try{this[style]=isText&&typeof previous==='string'?'#ffffff':neutralInverse(previous);return original.apply(this,args)}finally{this[style]=previous}}});undo.push(()=>own?Object.defineProperty(ctx,method,own):delete ctx[method])}return()=>undo.forEach(f=>f())}
async function render(){if(!doc)return;const token=++serial,d=doc,n=pageNo,z=zoom,dark=night;if(task){task.cancel();try{await task.promise}catch{}}if(token!==serial)return;controls();status('Rendering…');try{const p=await d.getPage(n);if(token!==serial)return;const vp0=p.getViewport({scale:1}),fit=Math.max(.1,(viewer.clientWidth-16)/vp0.width),scale=fit*z,ratio=Math.min(devicePixelRatio||1,2.5,Math.sqrt(10000000/(vp0.width*vp0.height*scale*scale)),8192/(vp0.width*scale),8192/(vp0.height*scale)),vp=p.getViewport({scale:scale*ratio});const temp=document.createElement('canvas');temp.width=Math.max(1,Math.floor(vp.width));temp.height=Math.max(1,Math.floor(vp.height));const ctx=temp.getContext('2d',{alpha:false}),undo=dark?selectiveNight(ctx):()=>{};try{const current=p.render({canvasContext:ctx,viewport:vp,background:'#ffffff'});task=current;try{await current.promise}finally{if(task===current)task=null}}finally{undo()}if(token!==serial)return;canvas.width=temp.width;canvas.height=temp.height;canvas.style.width=Math.round(vp0.width*scale)+'px';canvas.style.height=Math.round(vp0.height*scale)+'px';canvas.getContext('2d',{alpha:false}).drawImage(temp,0,0);temp.width=temp.height=0;canvas.classList.remove('hidden');$('empty').classList.add('hidden');status(dark?'Night mode · embedded images unfiltered':'Day mode · original colours')}catch(e){if(token===serial&&e.name!=='RenderingCancelledException')status('Render failed: '+e.message)}}
async function openFile(f){if(!f)return;const ticket=++loadSerial;++serial;if(task)task.cancel();status('Opening PDF…');try{await engine;const data=new Uint8Array(await f.arrayBuffer());if(ticket!==loadSerial)return;const loading=pdfjs.getDocument({data,isEvalSupported:false,cMapUrl:base+'cmaps/',cMapPacked:true,standardFontDataUrl:base+'standard_fonts/',wasmUrl:base+'wasm/',useWasm:false,enableXfa:false});loading.onPassword=(update,reason)=>{const password=prompt(reason===2?'Incorrect password. Try again:':'Enter PDF password:');if(password===null){loading.destroy();return}update(password)};const next=await loading.promise;if(ticket!==loadSerial){await next.destroy();return}const old=doc;doc=next;if(old)await old.destroy();pageNo=1;zoom=1;$('name').textContent=f.name;viewer.scrollTo(0,0);controls();await render()}catch(e){if(ticket===loadSerial)status('Cannot open PDF: '+e.message)}}
function go(n){if(!doc||!Number.isFinite(n))return;pageNo=Math.min(doc.numPages,Math.max(1,Math.trunc(n)));viewer.scrollTo(0,0);render()}
function setZoom(z){zoom=Math.min(4,Math.max(.5,z));render()}
for(const id of ['open','open2'])$(id).onclick=()=>$('file').click();$('file').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};$('mode').onclick=()=>{night=!night;localStorage.setItem('mode',night?'night':'day');controls();render()};$('prev').onclick=()=>go(pageNo-1);$('next').onclick=()=>go(pageNo+1);$('pageNo').onchange=e=>go(+e.target.value);$('out').onclick=()=>setZoom(zoom/1.25);$('in').onclick=()=>setZoom(zoom*1.25);$('fit').onclick=()=>setZoom(1);
let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(render,180)});let pinch=null;viewer.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),z:zoom}},{passive:true});viewer.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();pinch.next=pinch.z*Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)/pinch.d}},{passive:false});viewer.addEventListener('touchend',e=>{if(pinch&&e.touches.length<2){if(pinch.next)setZoom(pinch.next);pinch=null}});viewer.addEventListener('touchcancel',()=>pinch=null);
</script></body></html>
