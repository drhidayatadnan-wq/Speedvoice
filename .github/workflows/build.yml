name: Build debug APK
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedVoice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish experimental debug APK as prerelease
        if: ${{ github.ref == 'refs/heads/v0.8.2-speech-diagnostics' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.8.2-speech-diagnostics"
          cp app/build/outputs/apk/debug/app-debug.apk SpeedVoice-v0.8.2-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SpeedVoice-v0.8.2-debug.apk --clobber
          else
            gh release create "$TAG" SpeedVoice-v0.8.2-debug.apk --prerelease \
              --title "SpeedVoice v0.8.2 — experimental debug APK" \
              --notes "Experimental test build, not verified for real-world driving. Do not rely on speed-limit or overspeed announcements; follow road signs and the vehicle speedometer. Test only while safely parked. Debug builds may require removing older differently signed APKs."
          fi
